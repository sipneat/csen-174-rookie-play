services:
  frontend:
    image: rookie-play-frontend:latest
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped

  backend:
    image: rookie-play-backend:latest
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set}
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
